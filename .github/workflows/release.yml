name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate version and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
          python scripts/package_release.py --tag "$RELEASE_TAG" --check-version

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@v4
      - name: Image identity
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=A-STELLAR Mars mission planning demo
      - name: Test the exact release image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          docker tag "$IMAGE" a-stellar:local
          python -m pip install -c backend/constraints-runtime.txt './backend[planning,agentic]'
          python scripts/verify_docker.py --synthetic --no-build
      - name: Push tested image and create deployment assets
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker push "$IMAGE:$VERSION"
          DIGEST=$(docker image inspect "$IMAGE:$VERSION" --format '{{index .RepoDigests 0}}')
          python scripts/package_release.py --tag "$RELEASE_TAG" --image "$IMAGE" \
            --digest "${DIGEST#*@}" --revision "$GITHUB_SHA" --output-dir /tmp/release-dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "A-STELLAR $RELEASE_TAG" --notes-file /tmp/release-dist/release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" /tmp/release-dist/*-deploy.zip \
            /tmp/release-dist/release.json /tmp/release-dist/SHA256SUMS "${flags[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-acceptance
          path: |
            data/processed/docker-verification/**/summary.json
            data/processed/docker-verification/**/docker.log
          if-no-files-found: ignore
